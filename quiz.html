<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz | Algorithm & Quiz Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="stylesheet" href="style-v23.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Algorithm & Quiz Lab</a>
      <nav>
        <a class="active" href="quiz.html">Quiz</a>
        <a href="visualizer.html">Visualizer</a>
      </nav>
    </div>
  </header>

  <div class="standalone-back"><a href="index.html">← Επιστροφή στην ύλη</a></div>
<main class="container page-space">
    <section class="card quiz-card">
      <div id="start-screen">
        <p class="eyebrow">Πληροφορική • Quiz</p>
        <h1>Quiz βασικών εννοιών</h1>
        <p>6 ερωτήσεις με άμεση ανατροφοδότηση.</p>

        <div class="student-code-box">
          <label for="student-code">Κωδικός μαθητή</label>
          <input id="student-code" type="text" maxlength="20"
                 autocomplete="off" placeholder="π.χ. Β1-07">
          <small>Χρησιμοποίησε μόνο τον κωδικό που έδωσε ο εκπαιδευτικός — όχι ονοματεπώνυμο.</small>
          <div id="student-code-error" class="form-error hidden"></div>
        </div>

        <button id="start-btn">Έναρξη Quiz</button>
      </div>

      <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
          <span id="progress"></span>
          <span id="score"></span>
        </div>
        <h2 id="question"></h2>
        <div id="answers" class="answers"></div>
        <div id="feedback" class="feedback hidden"></div>
        <button id="next-btn" class="hidden">Επόμενη ερώτηση</button>
      </div>

      <div id="result-screen" class="hidden">
        <h2>Το quiz τελείωσε!</h2>
        <p id="final-score" class="final-score"></p>
        <p id="final-message"></p>
        <div id="save-status" class="save-status hidden"></div>
        <button id="restart-btn">Ξανά</button>
      </div>
    </section>
  </main>

  
  <!-- Static form blueprint: Netlify detects this during deploy. -->
  <form name="quiz-results" method="POST" data-netlify="true"
        netlify-honeypot="bot-field" id="quiz-results-form"
        class="netlify-hidden-form" aria-hidden="true">
    <input type="hidden" name="form-name" value="quiz-results">
    <input type="text" name="bot-field">
    <input type="hidden" name="student_code">
    <input type="hidden" name="quiz_name">
    <input type="hidden" name="score">
    <input type="hidden" name="total">
    <input type="hidden" name="percentage">
    <input type="hidden" name="submitted_at">
    <input type="hidden" name="answer_1">
    <input type="hidden" name="correct_1">
    <input type="hidden" name="answer_2">
    <input type="hidden" name="correct_2">
    <input type="hidden" name="answer_3">
    <input type="hidden" name="correct_3">
    <input type="hidden" name="answer_4">
    <input type="hidden" name="correct_4">
    <input type="hidden" name="answer_5">
    <input type="hidden" name="correct_5">
    <input type="hidden" name="answer_6">
    <input type="hidden" name="correct_6">
  </form>

  <script src="questions.js?v=2.2"></script>
  <script src="quiz.js?v=2.2"></script>

  <footer class="site-footer"><div class="container footer-inner"><span>Algorithm & Quiz Lab</span><span>Version 2.3</span></div></footer>
</body>
</html>
